<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SARAH OS | Compact Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="importmap">
        { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        /* Pinned Bottom Bar */
        .bottom-bar { position: absolute; bottom: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: auto; }
        
        /* Status Indicator */
        .status-pill { background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); cursor: default; }
        .status-text { color: rgba(255,255,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; margin-left: 10px; box-shadow: 0 0 8px #00ff88; }

        /* Mode Dropdown Container */
        .mode-container { display: flex; align-items: center; gap: 10px; }
        .mode-label { color: rgba(255,255,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        select { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 5px; cursor: pointer; outline: none; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
        
        #text-input-container { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 300px; display: none; z-index: 10; pointer-events: auto; }
        #chat-input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid #14b8a6; padding: 10px; color: white; border-radius: 4px; outline: none; text-align: center; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="text-input-container">
        <input type="text" id="chat-input" placeholder="Awaiting Command...">
    </div>

    <div class="bottom-bar">
        <div class="status-pill">
            <span class="status-text">STATUS</span>
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <div class="mode-container">
            <span class="mode-label">Mode</span>
            <select id="mode-select">
                <option value="voice">VOICE</option>
                <option value="text">TEXT</option>
            </select>
        </div>
    </div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    const GEMINI_KEY = "AIzaSyCI-E8dPH4Dv5ImrFQjgg8Q6lCSLO8Y14Q";
    const ELEVEN_LABS_KEY = "WAhoMTNdLdMoq1j3wf3I";
    const VOICE_ID = "21m00Tcm4TlvDq8ikWAM"; 

    const genAI = new GoogleGenerativeAI(GEMINI_KEY);
    const model = genAI.getGenerativeModel({ 
        model: "gemini-1.5-flash-latest",
        systemInstruction: "You are Sarah, the AI Secretary for Boss. Be witty, efficient, and address him as Boss. You manage his tasks, including B.Tech counseling and design projects."
    });

    // --- THREE.JS SPHERE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const particlesGeometry = new THREE.BufferGeometry();
    const posArray = [];
    const colors = [];
    for(let i=0; i<8000; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const r = 2;
        posArray.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
        const color = new THREE.Color();
        color.setHSL(Math.random() > 0.5 ? 0.5 : 0.8, 0.8, 0.6);
        colors.push(color.r, color.g, color.b);
    }
    particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.012, vertexColors: true, transparent: true, opacity: 0.7 });
    const sphere = new THREE.Points(particlesGeometry, material);
    scene.add(sphere);
    camera.position.z = 5;

    let targetScale = 0.5; 
    let currentScale = 0.5;

    function animate() {
        requestAnimationFrame(animate);
        sphere.rotation.y += 0.001;
        
        currentScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.1);
        const pulse = 1 + Math.sin(Date.now() * 0.002) * 0.03;
        sphere.scale.set(currentScale * pulse, currentScale * pulse, currentScale * pulse);
        
        renderer.render(scene, camera);
    }
    animate();

    // --- CONTINUOUS LISTENING ---
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = false; 
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    const statusDot = document.getElementById('status-dot');

    const startListening = () => { try { recognition.start(); } catch(e) {} };

    recognition.onstart = () => { statusDot.style.background = '#00ff88'; statusDot.style.boxShadow = '0 0 8px #00ff88'; };
    recognition.onend = () => { startListening(); }; 
    recognition.onerror = () => { statusDot.style.background = '#ff4444'; statusDot.style.boxShadow = '0 0 8px #ff4444'; };

    recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        if (transcript.includes("sarah")) {
            const command = transcript.split("sarah").pop();
            if (command.trim().length > 1) {
                processCommand(command);
            }
        }
    };

    async function processCommand(prompt) {
        targetScale = 1.3; 
        try {
            const result = await model.generateContent(prompt);
            const response = await result.response.text();
            await speak(response);
        } catch (e) {
            statusDot.style.background = '#ff4444';
        }
        targetScale = 0.5; 
    }

    async function speak(text) {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_LABS_KEY },
            body: JSON.stringify({ text: text, model_id: "eleven_monolingual_v1", voice_settings: { stability: 0.4, similarity_boost: 0.7 } })
        });
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        
        targetScale = 1.6;
        audio.onended = () => { targetScale = 0.5; };
        audio.play();
    }

    document.getElementById('mode-select').addEventListener('change', (e) => {
        document.getElementById('text-input-container').style.display = e.target.value === 'text' ? 'block' : 'none';
    });

    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { processCommand(e.target.value); e.target.value = ''; }
    });

    window.addEventListener('click', () => { startListening(); }, { once: true });
</script>
</body>
</html>
