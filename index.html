<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SARAH OS | Command Center</title>
    <!-- Three.js for the AI Sphere -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        /* Pinned Bottom Bar */
        .bottom-bar { position: absolute; bottom: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: auto; }
        
        /* Status Indicator */
        .status-pill { background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); cursor: default; backdrop-filter: blur(5px); }
        .status-text { color: rgba(255,255,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; margin-left: 10px; box-shadow: 0 0 8px #00ff88; transition: background 0.3s, box-shadow 0.3s; }

        /* Mode Dropdown Container */
        .mode-container { display: flex; align-items: center; gap: 10px; }
        .mode-label { color: rgba(255,255,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        select { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 5px; cursor: pointer; outline: none; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; backdrop-filter: blur(5px); }
        
        /* Text Input */
        #text-input-container { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 400px; display: none; z-index: 10; pointer-events: auto; }
        #chat-input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid #14b8a6; padding: 12px; color: white; border-radius: 4px; outline: none; text-align: center; font-style: italic; }
        #chat-input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="text-input-container">
        <input type="text" id="chat-input" placeholder="Awaiting Command..." autocomplete="off">
    </div>

    <div class="bottom-bar">
        <div class="status-pill">
            <span class="status-text">STATUS</span>
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <div class="mode-container">
            <span class="mode-label">Mode</span>
            <select id="mode-select">
                <option value="voice">VOICE</option>
                <option value="text">TEXT</option>
            </select>
        </div>
    </div>

<script>
    // --- API KEYS ---
    const GEMINI_KEY = "AIzaSyBG7i6Cc4KKyqoMUkx3Ryo6JVRZlrQ8QcI";
    const ELEVEN_LABS_KEY = "WAhoMTNdLdMoq1j3wf3I";
    const VOICE_ID = "21m00Tcm4TlvDq8ikWAM"; 

    // --- THREE.JS SPHERE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const particlesGeometry = new THREE.BufferGeometry();
    const posArray = [];
    const colors = [];
    for(let i=0; i<8000; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const r = 2;
        posArray.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
        const color = new THREE.Color();
        color.setHSL(Math.random() > 0.5 ? 0.5 : 0.8, 0.8, 0.6);
        colors.push(color.r, color.g, color.b);
    }
    particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.012, vertexColors: true, transparent: true, opacity: 0.7 });
    const sphere = new THREE.Points(particlesGeometry, material);
    scene.add(sphere);
    camera.position.z = 5;

    let targetScale = 0.5; // Compact Standby
    let currentScale = 0.5;

    function animate() {
        requestAnimationFrame(animate);
        sphere.rotation.y += 0.001;
        
        currentScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.1);
        const pulse = 1 + Math.sin(Date.now() * 0.002) * 0.03;
        sphere.scale.set(currentScale * pulse, currentScale * pulse, currentScale * pulse);
        
        renderer.render(scene, camera);
    }
    animate();

    // --- SYSTEM LOGIC & STATUS ---
    let systemError = false;
    const statusDot = document.getElementById('status-dot');
    const inputField = document.getElementById('chat-input');

    function setStatus(state) {
        if (state === 'error') {
            systemError = true;
            statusDot.style.background = '#ff4444';
            statusDot.style.boxShadow = '0 0 15px #ff4444';
        } else if (state === 'ok') {
            systemError = false;
            statusDot.style.background = '#00ff88';
            statusDot.style.boxShadow = '0 0 8px #00ff88';
        }
    }

    // --- SPEECH RECOGNITION (EARS) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = false; 
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    const startListening = () => { try { recognition.start(); } catch(e) {} };

    recognition.onstart = () => { if (!systemError) setStatus('ok'); };
    recognition.onend = () => { startListening(); }; // Infinite loop
    recognition.onerror = (event) => { 
        if (event.error !== 'no-speech' && !systemError) {
            setStatus('error');
        }
    };

    recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        inputField.value = "Heard: " + transcript; // Debug text
        
        // Wake words mapping
        const wakeWords = ["sarah", "sara", "cera", "hey sarah"];
        let command = "";
        
        for (let word of wakeWords) {
            if (transcript.includes(word)) {
                command = transcript.split(word).pop();
                break;
            }
        }

        if (command.trim().length > 1) {
            processCommand(command.trim());
        }
    };

    // --- RAW FETCH TO GEMINI (BRAIN) ---
    async function processCommand(prompt) {
        targetScale = 1.3; // Expand sphere
        inputField.value = "Thinking: " + prompt;
        
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: "You are Sarah, the AI Secretary for Boss. Be witty, efficient, and address him as Boss." }] },
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error("RAW API ERROR:", errorData);
                throw new Error("Gemini API Connection Failed.");
            }

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            inputField.value = "Sarah: " + aiText;
            setStatus('ok'); // Reset error state if successful
            await speak(aiText);

        } catch (e) {
            console.error("Brain crashed:", e);
            setStatus('error');
            inputField.value = "SYSTEM ERROR: Check Dev Console (F12)";
            targetScale = 0.5; // Shrink back on error
        }
    }

    // --- ELEVENLABS TTS (VOICE) ---
    async function speak(text) {
        try {
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_LABS_KEY },
                body: JSON.stringify({ text: text, model_id: "eleven_monolingual_v1", voice_settings: { stability: 0.4, similarity_boost: 0.7 } })
            });
            
            if (!response.ok) throw new Error("Voice API Failed");

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            
            targetScale = 1.6; // Pulse while speaking
            audio.onended = () => { targetScale = 0.5; inputField.value = ""; };
            audio.play();
        } catch (e) {
            console.error("Voice Error:", e);
            setStatus('error');
            targetScale = 0.5;
        }
    }

    // --- UI EVENT LISTENERS ---
    document.getElementById('mode-select').addEventListener('change', (e) => {
        document.getElementById('text-input-container').style.display = e.target.value === 'text' ? 'block' : 'none';
    });

    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim() !== '') { 
            processCommand(e.target.value); 
        }
    });

    // Boot system on first click
    window.addEventListener('click', () => { 
        startListening(); 
        inputField.value = ""; 
    }, { once: true });
</script>
</body>
</html>
